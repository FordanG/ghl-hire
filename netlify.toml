# Netlify build configuration, versioned alongside the app instead of
# living only in the Netlify dashboard. Publish directory and the
# Next.js runtime plugin are left to Netlify's built-in framework
# auto-detection (already working in production); this file pins the
# build command and Node version so they can't silently drift via a
# dashboard edit or a Netlify-side platform default change.
[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 requires Node >=20.9.0 (see node_modules/next/package.json).
  NODE_VERSION = "22"

# Security headers for every route, applied at the CDN. They used to be set in
# the Next.js middleware, which meant every request invoked a function.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.openai.com https://api.resend.com https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

